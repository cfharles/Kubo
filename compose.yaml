name: kubo-step1
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kubo
      POSTGRES_PASSWORD: "${KUBO_DB_PASSWORD:?Run python3 scripts/init-local-env.py first}"
      POSTGRES_DB: kubo
    ports:
      - "127.0.0.1:${KUBO_DB_PORT:-55432}:5432"
    volumes:
      - kubo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubo -d kubo"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  kubo_pgdata:
